<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bordeaux Métropole - Digital Twin Dashboard</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #000; color: white; }
        #cesiumContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .left-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            width: 260px; background: rgba(0,0,0,0.88); padding: 18px;
            border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }
        .right-panel {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            width: 320px; background: rgba(0,0,0,0.88); padding: 18px;
            border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.6); max-height: 88vh; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Left Panel -->
    <div class="left-panel">
        <h3>🚦 Bordeaux Digital Twin</h3>
        <label>Choose Area:</label><br>
        <select id="areaSelect" onchange="loadSelectedArea()" style="width:100%; padding:12px; margin:10px 0; background:#333; color:white; border:none; border-radius:8px;">
            <option value="" selected disabled>-- Select Area --</option>
            <option value="Pessac">Pessac</option>
            <option value="Talence">Talence</option>
            <option value="Mérignac">Mérignac</option>
            <option value="Bordeaux">Bordeaux City</option>
            <option value="Gradignan">Gradignan</option>
        </select>

        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸ Pause</button>
        <button id="resetBtn">↺ Reset</button>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <h3>📊 Live Analytics</h3>
        <p><strong>Area Selected:</strong> <span id="selectedArea">None</span></p>
        <!-- KPIs and Charts will come in next step -->
    </div>

    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYWRiYmQ5OC0yODM2LTRlZDktOTdiYi1jOTVhZDFjYzAwNjMiLCJpZCI6NDI3MjQ2LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzc5Mzg1MTN9.PfvUbwHuaBGd2FxCn_BRv8OPH0-2umfLKXH_F9D686k';

        let viewer;
        let currentRoads = null;

        const areaCenters = {
            "Pessac":     { lon: -0.615, lat: 44.806, height: 1500 },
            "Talence":    { lon: -0.589, lat: 44.808, height: 1500 },
            "Mérignac":   { lon: -0.685, lat: 44.833, height: 1500 },
            "Bordeaux":   { lon: -0.579, lat: 44.837, height: 1800 },
            "Gradignan":  { lon: -0.616, lat: 44.772, height: 1500 }
        };

        async function initCesium() {
            viewer = new Cesium.Viewer('cesiumContainer', {
                terrainProvider: await Cesium.createWorldTerrainAsync(),
                requestRenderMode: true,
                baseLayerPicker: false,
                geocoder: false
            });

            // Default France View
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-0.58, 44.85, 45000),
                duration: 3
            });

            // Buildings
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
            } catch(e) {}
        }

        async function loadSelectedArea() {
            const areaName = document.getElementById('areaSelect').value;
            if (!areaName || !viewer) return;

            document.getElementById('selectedArea').textContent = areaName;

            const center = areaCenters[areaName];

            // Camera Move
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(center.lon, center.lat, center.height),
                orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45) },
                duration: 2.5
            });

            // Remove old roads
            if (currentRoads) {
                viewer.entities.remove(currentRoads);
            }

            // Load New Roads
            const query = `[out:json][timeout:90];
                area["name"="${areaName}"]["admin_level"=8]->.searchArea;
                (way["highway"](area.searchArea); way["railway"="tram"](area.searchArea); way["railway"="rail"](area.searchArea););
                out geom;`;

            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query,
                    headers: { 'Content-Type': 'text/plain' }
                });
                const data = await res.json();

                currentRoads = viewer.entities.add({ name: 'Roads' });

                let major=0, sec=0, local=0, tram=0, rail=0;

                data.elements.forEach(el => {
                    if (el.type !== "way" || !el.geometry) return;

                    const positions = el.geometry.map(g => Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 8));

                    const highway = el.tags?.highway || "";
                    const railway = el.tags?.railway;

                    let color = Cesium.Color.GRAY;
                    let width = 5;

                    if (railway === "tram")      { color = Cesium.Color.fromCssColorString('#9b59b6'); width = 9; tram++; }
                    else if (railway === "rail") { color = Cesium.Color.fromCssColorString('#2c3e50'); width = 7; rail++; }
                    else if (["motorway","trunk","primary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#e74c3c'); width = 11; major++; }
                    else if (["secondary","tertiary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#f39c12'); width = 8; sec++; }
                    else { color = Cesium.Color.fromCssColorString('#7f8c8d'); width = 5; local++; }

                    viewer.entities.add({
                        parent: currentRoads,
                        polyline: {
                            positions: positions,
                            width: width,
                            material: new Cesium.PolylineGlowMaterialProperty({ color: color, glowPower: 0.2 }),
                            clampToGround: true
                        }
                    });
                });

                console.log(`${areaName} loaded: ${major} major, ${sec} secondary`);

            } catch (err) {
                console.error("Road loading error:", err);
                alert("Roads load nahi ho rahi. Internet check karo.");
            }
        }

        // Start
        initCesium();
    </script>
</body>
</html>
