<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bordeaux 3D Digital Twin - Simulation Control</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Widgets/widgets.css" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #cesiumContainer { width: 100vw; height: 100vh; }

        .control-panel {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0,0,0,0.85); color: white; padding: 18px 22px;
            border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            min-width: 320px;
        }
        .control-panel h3 { margin: 0 0 15px 0; }

        .btn-group {
            display: flex; gap: 8px; margin: 12px 0;
        }
        button {
            padding: 10px 16px; font-size: 14px; border: none; border-radius: 8px;
            background: #333; color: white; cursor: pointer; flex: 1;
        }
        button:hover { background: #555; }

        .speed-control {
            display: flex; align-items: center; gap: 10px; margin: 12px 0;
        }
        input[type="range"] { width: 100%; }
        
        .time-display {
            font-size: 15px; background: rgba(255,255,255,0.1); 
            padding: 10px; border-radius: 8px; text-align: center; margin-top: 8px;
        }

        select { 
            padding: 12px; font-size: 16px; border-radius: 8px; 
            background: #333; color: white; border: none; width: 100%; margin-top: 10px; 
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <!-- Control Panel -->
    <div class="control-panel">
        <h3>🚦 Bordeaux Métropole Digital Twin</h3>
        
        <label>Choose Area :</label><br>
        <select id="areaSelect" onchange="loadSelectedArea()">
            <option value="" selected disabled>-- Select Area --</option>
            <option value="Pessac">Pessac</option>
            <option value="Talence">Talence</option>
            <option value="Mérignac">Mérignac</option>
            <option value="Bordeaux">Bordeaux City</option>
            <option value="Gradignan">Gradignan</option>
        </select>

        <div class="btn-group">
            <button id="playBtn">▶ Play</button>
            <button id="pauseBtn">⏸ Pause</button>
            <button id="resetBtn">↺ Reset</button>
        </div>

        <div class="speed-control">
            <span>Speed:</span>
            <input type="range" id="speedSlider" min="0.5" max="8" step="0.5" value="1">
            <span id="speedValue">1x</span>
        </div>

        <div class="time-display">
            Simulation Time: <strong id="simTime">00:00:00</strong>
        </div>
    </div>

    <div class="legend" id="legend" style="position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 10px; font-size: 14px; display: none;">
    </div>

    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYWRiYmQ5OC0yODM2LTRlZDktOTdiYi1jOTVhZDFjYzAwNjMiLCJpZCI6NDI3MjQ2LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzc5Mzg1MTN9.PfvUbwHuaBGd2FxCn_BRv8OPH0-2umfLKXH_F9D686k'; 

        let viewer;
        let isPlaying = true;
        let currentSpeed = 1;
        let simulationStartTime = new Date();

        async function initCesium() {
            viewer = new Cesium.Viewer('cesiumContainer', {
                terrainProvider: await Cesium.createWorldTerrainAsync(),
                baseLayerPicker: false,
                geocoder: false,
                homeButton: true,
                sceneModePicker: true,
                navigationHelpButton: false
            });

            // 3D Buildings
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
            } catch(e) {
                console.log("Buildings load nahi hue");
            }

            // Default France View (Bordeaux region broad view)
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-0.58, 44.85, 45000),  // France ka broad view
                orientation: { heading: 0, pitch: Cesium.Math.toRadians(-35) },
                duration: 3
            });

            setupSimulationControls();
        }

        function setupSimulationControls() {
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            const simTimeEl = document.getElementById('simTime');

            playBtn.onclick = () => { isPlaying = true; };
            pauseBtn.onclick = () => { isPlaying = false; };
            resetBtn.onclick = () => { simulationStartTime = new Date(); };

            speedSlider.oninput = () => {
                currentSpeed = parseFloat(speedSlider.value);
                speedValue.textContent = currentSpeed + "x";
            };

            setInterval(() => {
                if (!isPlaying) return;
                const elapsed = Math.floor((new Date() - simulationStartTime) * currentSpeed / 1000);
                const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
                const m = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
                const s = (elapsed % 60).toString().padStart(2, '0');
                simTimeEl.textContent = `${h}:${m}:${s}`;
            }, 200);
        }

        // ================== Area Data ==================
        const areaCenters = {
            "Pessac": { lon: -0.615, lat: 44.806, height: 1200 },
            "Talence": { lon: -0.589, lat: 44.808, height: 1200 },
            "Mérignac": { lon: -0.685, lat: 44.833, height: 1200 },
            "Bordeaux": { lon: -0.579, lat: 44.837, height: 1200 },
            "Gradignan": { lon: -0.616, lat: 44.772, height: 1200 }
        };

        async function loadSelectedArea() {
            const areaName = document.getElementById('areaSelect').value;
            if (!areaName || !viewer) return;

            const center = areaCenters[areaName];

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(center.lon, center.lat, center.height),
                orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-45), roll: 0 },
                duration: 2.5
            });

            viewer.entities.removeAll();

            // Roads loading query
            const query = `[out:json][timeout:90];
                area["name"="${areaName}"]["admin_level"=8]->.searchArea;
                (way["highway"](area.searchArea); way["railway"="tram"](area.searchArea); way["railway"="rail"](area.searchArea););
                out geom;`;

            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST', body: query, headers: { 'Content-Type': 'text/plain' }
                });
                const data = await response.json();

                let major = 0, secondary = 0, local = 0, tram = 0, rail = 0;

                data.elements.forEach(el => {
                    if (el.type !== "way" || !el.geometry || el.geometry.length < 2) return;

                    const positions = el.geometry.map(g => Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 8));
                    const highway = el.tags?.highway || "";
                    const railway = el.tags?.railway;

                    let color, width;
                    if (railway === "tram")      { color = Cesium.Color.fromCssColorString('#9b59b6'); width = 9; tram++; }
                    else if (railway === "rail") { color = Cesium.Color.fromCssColorString('#2c3e50'); width = 7; rail++; }
                    else if (["motorway","trunk","primary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#e74c3c'); width = 11; major++; }
                    else if (["secondary","tertiary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#f39c12'); width = 8; secondary++; }
                    else { color = Cesium.Color.fromCssColorString('#7f8c8d'); width = 5.5; local++; }

                    viewer.entities.add({
                        polyline: {
                            positions: positions,
                            width: width,
                            material: new Cesium.PolylineGlowMaterialProperty({ color: color, glowPower: 0.25 }),
                            clampToGround: true
                        }
                    });
                });

                // Legend Update
                document.getElementById('legend').style.display = 'block';
                document.getElementById('legend').innerHTML = `
                    <strong>${areaName} Digital Twin</strong><br>
                    🔴 Major: ${major} | 🟠 Sec: ${secondary} | ⚫ Local: ${local}<br>
                    🟣 Tram: ${tram} | ⚫ Rail: ${rail}
                `;

            } catch (err) {
                console.error(err);
            }
        }

        // Start Cesium
        initCesium();
    </script>
</body>
</html>
