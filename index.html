<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bordeaux 3D Digital Twin - Optimized</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Widgets/widgets.css" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        /* Control panel style same as before */
        .control-panel { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(0,0,0,0.85); color: white; padding: 18px 22px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.6); min-width: 320px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div class="control-panel">
        <h3>🚦 Bordeaux Digital Twin (Optimized)</h3>
        <label>Choose Area :</label><br>
        <select id="areaSelect" onchange="loadSelectedArea()">
            <option value="" selected disabled>-- Select Area --</option>
            <option value="Pessac">Pessac</option>
            <option value="Talence">Talence</option>
            <option value="Mérignac">Mérignac</option>
            <option value="Bordeaux">Bordeaux City</option>
            <option value="Gradignan">Gradignan</option>
        </select>
    </div>

    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYWRiYmQ5OC0yODM2LTRlZDktOTdiYi1jOTVhZDFjYzAwNjMiLCJpZCI6NDI3MjQ2LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzc5Mzg1MTN9.PfvUbwHuaBGd2FxCn_BRv8OPH0-2umfLKXH_F9D686k';

        let viewer;
        let currentRoadsDataSource = null;

        async function initCesium() {
            viewer = new Cesium.Viewer('cesiumContainer', {
                terrainProvider: await Cesium.createWorldTerrainAsync(),
                baseLayerPicker: false,
                geocoder: false,
                homeButton: true,
                sceneModePicker: true,
                navigationHelpButton: false,
                
                // === Performance Optimizations ===
                requestRenderMode: true,           // Only render when needed
                maximumRenderTimeChange: Infinity,
                shadows: false,
                skyAtmosphere: false,              // Agar zaruri na ho toh off
                skyBox: false
            });

            // Global performance settings
            viewer.scene.fog.enabled = true;
            viewer.scene.globe.enableLighting = false;
            viewer.scene.debugShowFramesPerSecond = true; // FPS counter (development ke liye)

            // Default France View
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-0.58, 44.85, 45000),
                duration: 2
            });

            // 3D Buildings (optimized)
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
            } catch(e) {}

            loadSelectedArea(); // Optional: default area load karna ho toh
        }

        const areaCenters = { /* ... same as before ... */ };

        async function loadSelectedArea() {
            const areaName = document.getElementById('areaSelect').value;
            if (!areaName) return;

            const center = areaCenters[areaName];

            // Camera move
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(center.lon, center.lat, center.height || 1500),
                duration: 2
            });

            // Purane roads remove (better way)
            if (currentRoadsDataSource) {
                viewer.dataSources.remove(currentRoadsDataSource);
            }

            // Create new DataSource (better performance than entities)
            currentRoadsDataSource = new Cesium.CustomDataSource();
            viewer.dataSources.add(currentRoadsDataSource);

            // Overpass query same...
            const query = `[out:json][timeout:60];
                area["name"="${areaName}"]["admin_level"=8]->.searchArea;
                (way["highway"](area.searchArea); way["railway"="tram"](area.searchArea); way["railway"="rail"](area.searchArea););
                out geom;`;

            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST', body: query, headers: {'Content-Type': 'text/plain'}
                });
                const data = await res.json();

                data.elements.forEach(el => {
                    if (el.type !== "way" || !el.geometry) return;

                    const positions = el.geometry.map(g => 
                        Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 6)
                    );

                    const highway = el.tags?.highway || "";
                    const railway = el.tags?.railway;

                    let color = Cesium.Color.GRAY;
                    let width = 4;

                    if (railway === "tram") { color = Cesium.Color.fromCssColorString('#9b59b6'); width = 8; }
                    else if (railway === "rail") { color = Cesium.Color.fromCssColorString('#2c3e50'); width = 6; }
                    else if (["motorway","trunk","primary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#e74c3c'); width = 10; }
                    else if (["secondary","tertiary"].includes(highway)) { color = Cesium.Color.fromCssColorString('#f39c12'); width = 7; }

                    currentRoadsDataSource.entities.add({
                        polyline: {
                            positions: positions,
                            width: width,
                            material: new Cesium.PolylineGlowMaterialProperty({
                                color: color,
                                glowPower: 0.2
                            }),
                            clampToGround: true,
                            classificationType: Cesium.ClassificationType.TERRAIN
                        }
                    });
                });

            } catch (e) {
                console.error(e);
            }
        }

        initCesium();
    </script>
</body>
</html>
