<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bordeaux Métropole - Smart Digital Twin</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.128/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #000; color: white; }
        #cesiumContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .left-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            width: 260px; background: rgba(0,0,0,0.92); padding: 18px;
            border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.7);
        }
        .bottom-panel {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
            height: 245px; background: rgba(0,0,0,0.95); 
            border-top: 3px solid #e74c3c;
            padding: 12px 15px; display: flex; gap: 15px; overflow-x: auto;
        }
        .dash-card {
            background: rgba(255,255,255,0.08); padding: 12px; border-radius: 10px; min-width: 210px;
        }
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .kpi-item { text-align: center; background: rgba(255,255,255,0.1); padding: 6px; border-radius: 6px; }
        .kpi-value { font-size: 18px; font-weight: bold; color: #4ade80; }
        h4 { color: #f87171; margin-bottom: 8px; font-size: 15px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Left Panel -->
    <div class="left-panel">
        <h3>🚦 Bordeaux Digital Twin</h3>
        <label>Choose Area:</label><br>
        <select id="areaSelect" onchange="loadSelectedArea()" style="width:100%; padding:12px; margin:10px 0; background:#333; color:white; border:none; border-radius:8px;">
            <option value="" selected disabled>-- Select Area --</option>
            <option value="Pessac">Pessac</option>
            <option value="Talence">Talence</option>
            <option value="Mérignac">Mérignac</option>
            <option value="Bordeaux">Bordeaux City</option>
            <option value="Gradignan">Gradignan</option>
        </select>

        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸ Pause</button>
        <button id="resetBtn">↺ Reset</button>
    </div>

    <!-- Bottom Smart Dashboard -->
    <div class="bottom-panel">
        <div class="dash-card">
            <h4>📊 Live Traffic</h4>
            <div class="kpi-grid">
                <div class="kpi-item"><div class="kpi-value" id="totalV">463</div><div>Vehicles</div></div>
                <div class="kpi-item"><div class="kpi-value" id="avgS">36.4</div><div>Avg Speed</div></div>
                <div class="kpi-item"><div class="kpi-value" id="cong">58%</div><div>Congestion</div></div>
                <div class="kpi-item"><div class="kpi-value" id="delay">9.8</div><div>Delay (min)</div></div>
            </div>
        </div>

        <div class="dash-card">
            <h4>🌤️ Weather</h4>
            <div class="kpi-grid">
                <div class="kpi-item"><div class="kpi-value" id="temp">17.2°</div><div>Temp</div></div>
                <div class="kpi-item"><div class="kpi-value" id="humid">64%</div><div>Humidity</div></div>
                <div class="kpi-item"><div class="kpi-value" id="wind">12</div><div>Wind</div></div>
            </div>
        </div>

        <div class="dash-card">
            <h4>📈 Speed Trend</h4>
            <canvas id="speedChart" height="95"></canvas>
        </div>

        <div class="dash-card">
            <h4>🚗 Vehicle Mix</h4>
            <canvas id="vehicleChart" height="95"></canvas>
        </div>
    </div>

    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYWRiYmQ5OC0yODM2LTRlZDktOTdiYi1jOTVhZDFjYzAwNjMiLCJpZCI6NDI3MjQ2LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzc5Mzg1MTN9.PfvUbwHuaBGd2FxCn_BRv8OPH0-2umfLKXH_F9D686k';

        let viewer;
        let currentRoadEntities = [];

        const areaCenters = {
            "Pessac": { lon: -0.615, lat: 44.806, height: 1600 },
            "Talence": { lon: -0.589, lat: 44.808, height: 1600 },
            "Mérignac": { lon: -0.685, lat: 44.833, height: 1600 },
            "Bordeaux": { lon: -0.579, lat: 44.837, height: 2000 },
            "Gradignan": { lon: -0.616, lat: 44.772, height: 1600 }
        };

        async function initCesium() {
            viewer = new Cesium.Viewer('cesiumContainer', {
                terrainProvider: await Cesium.createWorldTerrainAsync(),
                requestRenderMode: true,
                baseLayerPicker: false
            });

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-0.58, 44.85, 45000),
                duration: 3
            });

            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
            } catch(e) {}

            initCharts();
            simulateLiveData();
        }

        function initCharts() {
            new Chart(document.getElementById('speedChart'), {
                type: 'line',
                data: { labels: ['0','5','10','15','20'], datasets: [{ data: [44,37,29,34,36], borderColor: '#4ade80', tension: 0.4 }] },
                options: { responsive: true, plugins: { legend: { display: false }}}
            });

            new Chart(document.getElementById('vehicleChart'), {
                type: 'pie',
                data: { labels: ['Car','Bus','Truck','Bike'], datasets: [{ data: [67,16,10,7], backgroundColor: ['#60a5fa','#34d399','#fbbf24','#c084fc'] }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#ddd', font: {size: 11}}}}}
            });
        }

        function simulateLiveData() {
            setInterval(() => {
                document.getElementById('totalV').textContent = Math.floor(380 + Math.random()*180);
                document.getElementById('avgS').textContent = (29 + Math.random()*18).toFixed(1);
                document.getElementById('cong').textContent = Math.floor(45 + Math.random()*45) + "%";
            }, 2500);
        }

        // ==================== MAIN ROAD LOADING FUNCTION ====================
        async function loadSelectedArea() {
            const areaName = document.getElementById('areaSelect').value;
            if (!areaName || !viewer) return;

            // Clear old roads
            currentRoadEntities.forEach(entity => viewer.entities.remove(entity));
            currentRoadEntities = [];

            const center = areaCenters[areaName];

            // Camera move
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(center.lon, center.lat, center.height),
                orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45) },
                duration: 2.5
            });

            const query = `[out:json][timeout:90];
                area["name"="${areaName}"]["admin_level"=8]->.searchArea;
                (way["highway"](area.searchArea); way["railway"="tram"](area.searchArea); way["railway"="rail"](area.searchArea););
                out geom;`;

            try {
                const res = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query,
                    headers: { 'Content-Type': 'text/plain' }
                });
                const data = await res.json();

                data.elements.forEach(el => {
                    if (el.type !== "way" || !el.geometry || el.geometry.length < 2) return;

                    const positions = el.geometry.map(g => Cesium.Cartesian3.fromDegrees(g.lon, g.lat, 8));

                    const highway = el.tags?.highway || "";
                    const railway = el.tags?.railway;

                    let color, width = 5.5;

                    if (railway === "tram") {
                        color = Cesium.Color.fromCssColorString('#c026d3'); // Bright Magenta
                        width = 10;
                    } else if (railway === "rail") {
                        color = Cesium.Color.fromCssColorString('#1e40af'); // Deep Blue
                        width = 8;
                    } else if (["motorway","trunk"].includes(highway)) {
                        color = Cesium.Color.fromCssColorString('#ef4444'); // Bright Red
                        width = 13;
                    } else if (["primary"].includes(highway)) {
                        color = Cesium.Color.fromCssColorString('#f97316'); // Orange-Red
                        width = 11;
                    } else if (["secondary","tertiary"].includes(highway)) {
                        color = Cesium.Color.fromCssColorString('#eab308'); // Bright Yellow-Orange
                        width = 8.5;
                    } else {
                        color = Cesium.Color.fromCssColorString('#94a3b8'); // Slate Gray
                        width = 5;
                    }

                    const road = viewer.entities.add({
                        polyline: {
                            positions: positions,
                            width: width,
                            material: new Cesium.PolylineGlowMaterialProperty({
                                color: color,
                                glowPower: 0.35
                            }),
                            clampToGround: true
                        }
                    });

                    currentRoadEntities.push(road);
                });

                console.log(`${areaName} - Roads Loaded Successfully`);

            } catch (err) {
                console.error(err);
                alert("Roads load nahi ho rahi. Internet check karo.");
            }
        }

        // Start Application
        initCesium();
    </script>
</body>
</html>
